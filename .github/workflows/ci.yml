name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux matrix: 3.10, 3.11, 3.12
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          # Windows: 3.11
          - os: windows-latest
            python-version: "3.11"
          # macOS smoke test: 3.11
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile source
        run: python -m compileall -q src

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Verify CLI entry points
        run: |
          sidekick --help
          sidekick-delegate --help
          sidekick init --help
          sidekick doctor --help

  ci-gate:
    name: ci-gate
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify matrix test outcome
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "CI test matrix failed with status: ${{ needs.test.result }}"
            exit 1
          fi
          echo "All CI matrix jobs succeeded."
